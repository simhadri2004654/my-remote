[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino

monitor_speed = 115200
upload_speed = 115200
board_build.filesystem = littlefs

lib_deps =
    zinggjm/GxEPD2@^1.6.6
    adafruit/Adafruit GFX Library
    https://github.com/ricmoo/QRCode.git

build_flags =
    -Wno-unknown-pragmas
